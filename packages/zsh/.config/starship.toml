
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

# Line 1:
#   OS context directory git ───────── duration python terraform
#
# Line 2:
#   prompt character

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$cmd_duration\
$python\
$golang\
$line_break\
$character"""

# ─────────────────────────────────────────────────────────────────────────────
# Filler
# ─────────────────────────────────────────────────────────────────────────────
[fill]
symbol = "─"
style = "fg:244"

# ─────────────────────────────────────────────────────────────────────────────
# OS
# ─────────────────────────────────────────────────────────────────────────────
[os]
disabled = false
format = "[$symbol](bold white)  "
[os.symbols]
Arch = ""
Linux = ""

# ─────────────────────────────────────────────────────────────────────────────
# Context
# ─────────────────────────────────────────────────────────────────────────────
[username]
show_always = false
style_user = "fg:180"
style_root = "bold fg:178"
format = "[$user]($style)"
[hostname]
ssh_only = true
ssh_symbol = ""
style = "fg:180"
format = "[@$hostname]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────────────────────────────────────
[directory]
style = "fg:39"
read_only = " "
read_only_style = "fg:196"
truncation_length = 8
truncate_to_repo = false
truncation_symbol = ""
fish_style_pwd_dir_length = 1
before_repo_root_style = "fg:31"
repo_root_style = "bold fg:39"
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format = """
[$before_root_path]($before_repo_root_style)\
[$repo_root]($repo_root_style)\
[$path](fg:31)\
[$read_only]($read_only_style) """

# ─────────────────────────────────────────────────────────────────────────────
# Git branch
# ─────────────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold fg:76"
truncation_length = 32
truncation_symbol = "…"
only_attached = true
format = "[$symbol$branch(:$remote_branch)]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Detached Git commit / tag
# ─────────────────────────────────────────────────────────────────────────────
[git_commit]
only_detached = true
commit_hash_length = 8
tag_disabled = false
tag_symbol = "#"
style = "fg:76"
format = "[($tag )@$hash]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Git operation state
# ─────────────────────────────────────────────────────────────────────────────
[git_state]
style = "fg:196"
format = "[$state( $progress_current/$progress_total)]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Git status
# ─────────────────────────────────────────────────────────────────────────────
[git_status]
format = "($all_status$ahead_behind )"
style = ""
conflicted = "[~${count}](fg:196) "
stashed    = "[*${count}](fg:76) "
modified   = "[!${count}](fg:178) "
staged     = "[+${count}](fg:178) "
renamed    = "[+${count}](fg:178) "
deleted    = "[!${count}](fg:178) "
untracked  = "[?${count}](fg:39) "
ahead    = "[⇡${count}](fg:76)"
behind   = "[⇣${count}](fg:76)"
diverged = "[⇣${behind_count}⇡${ahead_count}](fg:76)"
up_to_date = ""

# ─────────────────────────────────────────────────────────────────────────────
# Command duration
# ─────────────────────────────────────────────────────────────────────────────
[cmd_duration]
min_time = 3000
show_milliseconds = false
style = "fg:101"
format = "[󰔟 $duration]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Python virtualenv
# ─────────────────────────────────────────────────────────────────────────────
[python]
symbol = " "
style = "fg:37"
format = " [${symbol}${virtualenv}]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Golang
# ─────────────────────────────────────────────────────────────────────────────
[golang]
symbol = " "
style = "fg:37"
format = " [$symbol]($style) "

# ─────────────────────────────────────────────────────────────────────────────
# Prompt character
# ─────────────────────────────────────────────────────────────────────────────
[character]
success_symbol = "[➜](bold fg:76)"
error_symbol = "[➜](bold fg:196)"
vimcmd_symbol = "[](bold fg:76)"
vimcmd_replace_one_symbol = "[▶](bold fg:76)"
vimcmd_replace_symbol = "[▶](bold fg:76)"
vimcmd_visual_symbol = "[V](bold fg:76)"

