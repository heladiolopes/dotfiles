# Intentional preferences only; omitted options retain btop defaults.
color_theme = "~/.config/btop/themes/current.theme"
theme_background = false
truecolor = true
vim_keys = true
rounded_corners = true
terminal_sync = true
graph_symbol = "tty"
shown_boxes = "net proc mem gpu0 cpu"
update_ms = 500
proc_sorting = "memory"
proc_tree = true
proc_mem_bytes = true
cpu_single_graph = true
show_cpu_watts = true
show_coretemp = true
show_disks = true
only_physical = true
use_fstab = true
net_auto = true
net_sync = true
save_config_on_exit = false
