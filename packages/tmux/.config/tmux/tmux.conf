# ---------------- [[ Options  ]] ----------------

# Set true color
set -ag terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -g mouse on

# Set status line to be on top
set -g status-position top

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
# set-window-option -g pane-base-index 1
set -g renumber-windows on

# Set Vi Mode
setw -g mode-keys vi

# ---------------- [[ Sensible Defaults ]] ----------------

# Reduce delay after Escape, especially in Vim-style applications.
set -s escape-time 0

# Retain more terminal output for scrolling and searching.
set -g history-limit 50000

# Keep tmux messages visible for four seconds.
set -g display-time 4000

# Forward terminal focus events to applications that support them.
set -g focus-events on

# Resize grouped-session windows based on the smallest attached client.
setw -g aggressive-resize on

# ---------------- [[ Bindings ]] ----------------

# Set prefix bind
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set key to reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"

# Window Management - Open in current path
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# Resizing windows
bind -r j resize-pane -D 5 # Move Pane down
bind -r k resize-pane -U 5 # Move Pane up
bind -r l resize-pane -R 5 # Move Pane right
bind -r h resize-pane -L 5 # Move Pane left

# # Shift arrow to switch windows
# bind -n S-Left previous-window
# bind -n S-Right next-window
unbind S-Left
unbind S-Right

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ----------- [[ Native Vim/Tmux Navigation ]] -----------

# Detect Vim, Neovim, and fzf running in the current pane. When detected,
# forward navigation keys to the application; otherwise move between tmux
# panes while preserving the window's zoom state.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -Z -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -Z -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -Z -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -Z -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -Z -l'

# Keep pane navigation available while tmux copy mode is active.
bind-key -T copy-mode-vi C-h select-pane -Z -L
bind-key -T copy-mode-vi C-j select-pane -Z -D
bind-key -T copy-mode-vi C-k select-pane -Z -U
bind-key -T copy-mode-vi C-l select-pane -Z -R
bind-key -T copy-mode-vi 'C-\' select-pane -Z -l

# Editor-side mappings remain outside this package. They are required for true
# split-boundary handoff from an editor back to tmux.
# Upstream: https://github.com/christoomey/vim-tmux-navigator

# Vi mode bindings
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ---------------- [[ Native Clipboard ]] ----------------

# Send tmux-owned copies to the outer terminal through OSC 52.
# `external` prevents applications inside panes from creating tmux buffers.
# Kitty already permits write-clipboard and write-primary operations.
set -s set-clipboard external

# ------------- [[ Tool Popups and Dotfiles Menu ]] --------------

bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit
bind C-e display-popup -d "#{pane_current_path}" -w 90% -h 90% -E yazi
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E 'target="$(tmux list-sessions -F "#{session_name}" | grep -vx "#{session_name}" | fzf --reverse)"; [ -z "$target" ] || tmux switch-client -t "$target"'
bind d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  "zshrc"             z  "new-window -c \"#{pane_current_path}\" 'nvim ~/.config/zsh/.zshrc'" \
  "tmux"              t  "new-window -c \"#{pane_current_path}\" 'nvim ~/.config/tmux/tmux.conf'" \
  "nvim"              n  "new-window -c \"#{pane_current_path}\" 'nvim ~/.config/nvim/init.lua'" \
  "hyprland"          h  "new-window -c \"#{pane_current_path}\" 'nvim ~/.config/hypr/hyprland.lua'" \
  "waybar"            w  "new-window -c \"#{pane_current_path}\" 'nvim ~/.config/waybar/config.jsonc'" \
  "Exit"              q  ""

# ----------------- [[ Theme ]] -----------------

source-file ~/.config/tmux/themes/current.conf

