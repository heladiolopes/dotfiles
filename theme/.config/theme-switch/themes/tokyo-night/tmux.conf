set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-bg "#1a1b26"
set -g status-fg "#c0caf5"
set -g status-left-length 100
set -g status-right-length 100
set -g pane-border-style fg="#414868"
set -g pane-active-border-style fg="#7aa2f7"

setw -g window-status-format "#[bg=#1a1b26,fg=#a9b1d6]#[bg=#a9b1d6,fg=#1a1b26]#I #[bg=#24283b,fg=#c0caf5] #W#[bg=#1a1b26,fg=#24283b]#[default]"
setw -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26] #I #[bg=#24283b,fg=#c0caf5] #W #[default]"
set -g status-left ""
set -g status-right "#(gitmux -cfg ~/.config/tmux/gitmux.conf '#{pane_current_path}')"
set -ag status-right "#[bg=#1a1b26,fg=#f7768e]#[bg=#f7768e,fg=#1a1b26] #[bg=#1a1b26,fg=#c0caf5] #(tmux display-message -p '#{pane_current_command}') #[default]"
set -ag status-right "#[bg=#1a1b26,fg=#e0af68]#[bg=#e0af68,fg=#1a1b26] #[bg=#1a1b26,fg=#c0caf5] #(top -bn1 | grep 'Cpu(s)' | awk '{print $2 + $4}')% #[default]"
set -ag status-right "#[bg=#1a1b26,fg=#9ece6a]#[bg=#9ece6a,fg=#1a1b26] #[bg=#1a1b26,fg=#c0caf5] #S #[default]"
setw -g mode-style bg='#24283b',fg='#c0caf5'
set -g message-style bg='#24283b',fg='#c0caf5'
