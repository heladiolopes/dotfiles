$font = JetBrainsMonoNerdFont

# GENERAL
general {
  grace = 1
  fractional_scaling = 2
  immediate_render = true
  hide_cursor = true
  ignore_empty_input = true
}

# BACKGROUND
background {
  monitor =
  # path = screenshot
  path = ~/.config/backgrounds/minimalist-bridge.jpg
  color = rgba(15, 17, 26, 1.0)
  blur_size = 3
  blur_passes = 2
}

# ANIMATIONS
animations {
  enabled = true

  bezier = linear, 1, 1, 0, 0

  animation = fadeIn, 1, 1, linear
  animation = fadeOut, 1, 1, linear
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 40
  position = 0, -30%
  halign = center
  valign = center

  outer_color = rgba(143, 143, 143, 1.0)
  inner_color = rgba(250, 250, 250, 0.8)
  outline_thickness = 1

  font_family = $font
  font_color = rgb(143, 143, 143)

  placeholder_text = <i>Password...</i>
  check_color = rgba(68, 157, 171, 1.0)
  fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>

  dots_text_format = *
  dots_size = 0.26
  dots_spacing = 0.64
  dots_center = true

  rounding = 10
  shadow_passes = 0
  fade_on_empty = false
}

# TIME
label {
  monitor =
  text = $TIME
  font_size = 80
  font_family = $font

  position = 0, -30%
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
  font_size = 25
  font_family = $font

  position = 0, -45%
  halign = center
  valign = top
}

